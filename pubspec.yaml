name: school_aura
description: School Emergency Alert System – real-time alerts, live tracking, and role-based response management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ──────────────────────────────────────────────────────────
  go_router: ^13.2.1

  # ── Firebase ────────────────────────────────────────────────────────────
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.5
  cloud_firestore: ^4.17.3
  firebase_storage: ^11.7.5
  firebase_messaging: ^14.9.2
  google_sign_in: ^6.2.1

  # ── Location ────────────────────────────────────────────────────────────
  geolocator: ^11.0.0
  background_locator_2: ^2.0.7      # Background location
  flutter_foreground_task: ^8.0.2   # Foreground service wrapper

  # ── Maps ────────────────────────────────────────────────────────────────
  google_maps_flutter: ^2.6.1
  flutter_map: ^6.1.0               # OSM alternative / offline fallback

  # ── Notifications ────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.1.2

  # ── Storage ─────────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # ── Utilities ────────────────────────────────────────────────────────────
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  intl: ^0.19.0
  logger: ^2.3.0
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code generation ──────────────────────────────────────────────────────
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

  # ── Testing ──────────────────────────────────────────────────────────────
  mocktail: ^1.0.3
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
